version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: olt_sentinel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "{{POSTGRES_PASSWORD}}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - olt-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  backend:
    image: ghcr.io/lukasmanakel/olt-sentinel-backend:latest
    environment:
      DATABASE_URL: "postgresql://postgres:{{POSTGRES_PASSWORD}}@postgres:5432/olt_sentinel"
      ZABBIX_URL: "{{ZABBIX_URL}}"
      ZABBIX_TOKEN: "{{ZABBIX_TOKEN}}"
      GRAFANA_URL: "{{GRAFANA_URL}}"
      GRAFANA_TOKEN: "{{GRAFANA_TOKEN}}"
      WEBHOOK_URL: "{{WEBHOOK_URL}}"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      PORT: "3001"
    ports:
      - "3001:3001"
    networks:
      - olt-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  frontend:
    image: ghcr.io/lukasmanakel/olt-sentinel-frontend:latest
    ports:
      - "3000:80"
    networks:
      - olt-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  olt-net:
    driver: overlay

volumes:
  pgdata:
